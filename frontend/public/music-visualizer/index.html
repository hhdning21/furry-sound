<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Visualization System</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <aside class="panel">
      <h1>Music Visualization System</h1>

      <div class="group">
        <label>Audio File</label>
        <input id="fileInput" type="file" accept="audio/*" />
      </div>

      <div class="group row">
        <button id="playBtn">Play</button>
        <button id="pauseBtn">Pause</button>
      </div>

      <div class="group row">
        <button id="micBtn">Use Microphone</button>
        <button id="streamBtn">Use Stream</button>
      </div>

      <div class="group">
        <label for="streamUrl">Live Stream URL</label>
        <input id="streamUrl" type="text" placeholder="https://..." />
      </div>

      <div class="group">
        <label for="modeSelect">Visualization Mode</label>
        <select id="modeSelect">
          <option value="landscape">Sound Landscape</option>
          <option value="water">Resonance Water</option>
          <option value="particles">Particle Storm</option>
          <option value="pulseWall">Rhythm Pulse Wall</option>
          <option value="cosmos">Cosmic Concert Mode</option>
        </select>
      </div>

      <div class="group">
        <label for="themeSelect">Color Theme</label>
        <select id="themeSelect">
          <option value="neon">Neon</option>
          <option value="ice">Ice</option>
          <option value="sunset">Sunset</option>
        </select>
      </div>

      <div class="group">
        <label>Sensitivity (Amplitude)</label>
        <input id="ampSensitivity" type="range" min="0.2" max="2" step="0.05" value="1" />
      </div>

      <div class="group">
        <label>Sensitivity (Beat)</label>
        <input id="beatSensitivity" type="range" min="0.2" max="2" step="0.05" value="1" />
      </div>

      <div class="group">
        <label>Sensitivity (Motion)</label>
        <input id="motionSensitivity" type="range" min="0.2" max="2" step="0.05" value="1" />
      </div>

      <div class="group row">
        <label class="inline"><input id="hapticToggle" type="checkbox" /> Haptic Cues</label>
      </div>

      <div class="group status">
        <div><strong>Section:</strong> <span id="sectionLabel">Intro</span></div>
        <div><strong>Pitch:</strong> <span id="pitchLabel">-- Hz</span></div>
        <div><strong>Beat:</strong> <span id="beatLabel">No</span></div>
      </div>

      <audio id="audioPlayer" controls crossorigin="anonymous"></audio>
    </aside>

    <div id="beatIndicator" class="beat-indicator"></div>
    <div id="rhythmMarkers" class="rhythm-markers"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
