<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Visualization System</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <aside class="panel" id="controlPanel">
      <div class="panel-header">
        <h1>Music Visualization System</h1>
        <button id="panelToggleBtn" class="panel-toggle" type="button" aria-expanded="true" title="Collapse panel">
          ◀
        </button>
      </div>

      <div class="group">
        <label>Audio File</label>
        <input id="fileInput" type="file" accept="audio/*" />
      </div>

      <div class="group row">
        <button id="playBtn">Play</button>
        <button id="pauseBtn">Pause</button>
      </div>

      <div class="group row">
        <button id="micBtn">Mic: Off</button>
      </div>

      <div class="group">
        <label for="modeSelect">Visualization Mode</label>
        <select id="modeSelect">
          <option value="water">Resonance Water</option>
          <option value="pulseWall">Rhythm Pulse Wall</option>
          <option value="accessible">Accessible Rhythm (Recommended for Hearing-Impaired)</option>
          <option value="interactive">Interactive Rhythm Mode (New)</option>
        </select>
      </div>

      <div class="group">
        <label for="difficultySelect">Interactive Difficulty</label>
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="mid" selected>Mid</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="group row">
        <label class="inline">
          <input id="accessibilityToggle" type="checkbox" /> 
          Enhanced Accessibility Mode
        </label>
      </div>

      <div class="group">
        <label for="themeSelect">Color Theme</label>
        <select id="themeSelect">
          <option value="ice">Ice</option>
          <option value="sunset" selected>Sunset (Red/Orange)</option>
        </select>
      </div>

      <div class="group row">
        <label class="inline"><input id="hapticToggle" type="checkbox" /> Haptic Cues</label>
      </div>

      <div class="group status">
        <div><strong>Section:</strong> <span id="sectionLabel">Intro</span></div>
        <div><strong>Pitch:</strong> <span id="pitchLabel">-- Hz</span></div>
        <div><strong>Beat:</strong> <span id="beatLabel">No</span></div>
      </div>

      <audio id="audioPlayer" controls crossorigin="anonymous"></audio>
    </aside>

    <div id="beatIndicator" class="beat-indicator"></div>
    <div id="rhythmMarkers" class="rhythm-markers"></div>

    <!-- Visual Language Legend for Hearing-Impaired Users -->
    <div id="visualLegend" class="visual-legend" style="display: none;">
      <h3>Visual Rhythm Guide</h3>
      <div class="legend-items">
        <div class="legend-item">
          <div class="legend-symbol circle-symbol"></div>
          <div class="legend-text">
            <strong>Circle Pulse (Center)</strong>
            <span>Kick / Bass Beat - Main rhythm</span>
          </div>
        </div>
        <div class="legend-item">
          <div class="legend-symbol triangle-symbol"></div>
          <div class="legend-text">
            <strong>Triangle Flash (Sides)</strong>
            <span>Snare Hit - Rhythm accent</span>
          </div>
        </div>
        <div class="legend-item">
          <div class="legend-symbol particle-symbol"></div>
          <div class="legend-text">
            <strong>Small Particles</strong>
            <span>Hi-hat / Treble - High frequency details</span>
          </div>
        </div>
        <div class="legend-item">
          <div class="legend-symbol wave-symbol"></div>
          <div class="legend-text">
            <strong>Expanding Waves</strong>
            <span>Bass Energy - Low frequency power</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
